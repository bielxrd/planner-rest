<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Planner convite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: "Inter";
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
            margin-top: 32px;
        }

        .image-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        img {
            color: black;
            width: 150px;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .content button {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: #09090b;
            margin-top: 24px;
        }

        .content button a {
            width: 100%;
            height: 100%;
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: "Inter";
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        Convite para a viagem
    </div>
    <div class="content">
        <div class="image-container">
            <img src="/static/img/Logo-black.svg" alt="Logo planner"/>
        </div>
        <span>Olá, seja bem vindo!</span>
        <span>Você foi convidado a participar da viagem #{destination} que está previsto para #{date}</span>
        <span>Para confirmar sua presença, clique no botão abaixo</span>
        <button>
            <a href="#{link}">
                Confirmar presença
            </a>
        </button>
    </div>
</div>
</body>
</html>
